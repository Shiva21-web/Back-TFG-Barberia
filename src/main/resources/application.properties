# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN
# Sistema de Gestión de Citas - Peluquería
# ============================================

# Nombre de la aplicación
spring.application.name=gestion-citas-peluqueria

# Puerto del servidor (por defecto 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS
# ============================================

# URL de conexión a MySQL
# Formato: jdbc:mysql://[host]:[puerto]/[nombre_bd]?parámetros
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Usuario de MySQL
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# Contraseña de MySQL (CAMBIAR EN PRODUCCIÓN)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver de MySQL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================

# Dialecto de MySQL para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar las consultas SQL en consola (útil para debugging)
spring.jpa.show-sql=true

# Formatear las consultas SQL para mejor lectura
spring.jpa.properties.hibernate.format_sql=true

# Estrategia de generación de esquema
# - none: No hacer nada (usar para producción)
# - validate: Validar que el esquema coincida con las entidades
# - update: Actualizar el esquema si es necesario (CUIDADO EN PRODUCCIÓN)
# - create: Crear el esquema (BORRA DATOS EXISTENTES)
# - create-drop: Crear al inicio y borrar al final
spring.jpa.hibernate.ddl-auto=validate

# Habilitar el registro de valores de parámetros en SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURACIÓN DE CORS (Cross-Origin Resource Sharing)
# ============================================
# Permite que el frontend (que corre en otro puerto) acceda a la API

# Orígenes permitidos (ajustar según el puerto del frontend)
# Para desarrollo local, permitimos localhost en cualquier puerto
cors.allowed-origins=https://bejewelled-flan-4573da.netlify.app,http://localhost:*,http://127.0.0.1:*,file://

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================

# Nivel de log para la aplicación
logging.level.com.peluqueria.gestioncitas=DEBUG

# Nivel de log para Spring Framework
logging.level.org.springframework.web=INFO

# Nivel de log para Hibernate
logging.level.org.hibernate=INFO

# ============================================
# CONFIGURACIÓN DE FORMATO DE FECHA/HORA
# ============================================

# Formato de fecha en JSON (yyyy-MM-dd)
spring.jackson.date-format=yyyy-MM-dd

# Zona horaria
spring.jackson.time-zone=Europe/Madrid

# Serialización de fechas como timestamps o strings
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================
# CONFIGURACIÓN DE MENSAJES DE ERROR
# ============================================

# Incluir mensaje de error en respuestas (útil para desarrollo)
server.error.include-message=always

# Incluir detalles del binding en errores de validación
server.error.include-binding-errors=always

# Incluir stack trace en respuestas de error (solo desarrollo)
server.error.include-stacktrace=on_param

# ============================================
# CONFIGURACIÓN DE CODIFICACIÓN
# ============================================

# Codificación de caracteres
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ============================================
# NOTAS IMPORTANTES
# ============================================
# 1. CAMBIAR la contraseña de MySQL en producción
# 2. Usar ddl-auto=validate en producción (nunca update o create)
# 3. Configurar CORS apropiadamente para producción
# 4. Desactivar show-sql en producción
# 5. Ajustar niveles de logging para producción
# ============================================